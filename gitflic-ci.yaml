# Данный файл - шаблонная конфигурация CI/CD конвейера. Он может быть изменен по Вашему усмотрению. 
# Некоторые шаблоны требуют предварительной настройки перед запуском.
#
# Подробнее о синтаксисе можно узнать в документации:
# https://docs.gitflic.ru/cicd/gitflic-ci-yaml

image: eclipse-temurin:17-jdk-jammy

variables:

  # Версия компилятора Android
  # Должна совпадать с compileSdkVersion.
  ANDROID_COMPILE_SDK: "34"

  # ANDROID_BUILD_TOOLS версия Android для инструментов сборки
  # Должна совпадать с buildToolsVersion.
  ANDROID_BUILD_TOOLS: "35.0.0"

  # https://developer.android.com/studio/index.html
  # SDK tools указаны в формате:
  #        commandlinetools-os_type-ANDROID_SDK_TOOLS_latest.zip
  ANDROID_SDK_TOOLS: "11076708"

  ANDROID_HOME: "android_sdk_root"

# Установка пакетов перед выполнением
before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  # - wget --quiet -c https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  # - mkdir -p ~/android_sdk
  # - unzip -o -q commandlinetools-linux-11076708_latest.zip -d ~/android_sdk
  # - mkdir -p ~/android_sdk/cmdline-tools/latest
  # - find ~/android_sdk/cmdline-tools/ -mindepth 1 -maxdepth 1 -type f \( -path "./latest" -prune \) -o -exec mv {} ~/android_sdk/cmdline-tools/latest \;
  # - export PATH="$PATH:$HOME/android_sdk/cmdline-tools/latest/bin"
  # - apt-get install --yes sdkmanager

  - install -d $ANDROID_HOME
  #
  - wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
  - unzip -o -q -d "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools.zip"
  - mv -T "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin

  - sdkmanager --version

  - yes | sdkmanager --licenses  || true
  - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
  - sdkmanager "platform-tools"
  - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
  - yes | sdkmanager --licenses  || true
  - chmod +x ./gradlew

lintDebug:
  stage: build
  script:
    - ./gradlew -Pci --console=plain :app:lintDebug -PbuildDir=lint
  artifacts:
    paths:
      - app/lint/reports/lint-results-debug.html
    expose_as: "lint-report"
    when: always


assembleDebug:
  stage: build
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/

debugTests:
  need: 
    - lintDebug
    - assembleDebug
  stage: test
  script:
    - ./gradlew -Pci --console=plain :app:testDebug
